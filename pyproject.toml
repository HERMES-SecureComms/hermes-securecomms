[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-simulator"
version = "0.1.0"
description = "Software-only reference simulator for HERMES PTT authorization policies"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hermes-simulator = "hermes_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

